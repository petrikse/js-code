<DOCTYPE HTML>
<html>
<head>
<title>Guess the number</title>
</head>

<body>

<p>Guess the number 1-10</p>

<input type="number" id="guess" placeholder="enter number">
<button onclick="guess()">SUBMIT</button>

<h1 id="result"></h1>
<h2 id="points"></h2>

<script>

alert("Cau ty cavo");

let randomNumber = Math.floor(Math.random() * 10) + 1;
let points = 100;

function guess() {

    let userGuess = Number(document.getElementById("guess").value);
    let result = document.getElementById("result");
    let scoreText = document.getElementById("points");

    if (userGuess == randomNumber) {
        result.textContent = "Correct! You guessed it!";
        points = points * 2;
        scoreText.textContent = "points: " + points;
    } else {
        result.textContent = "Wrong! Try again.";
        points = points - 50;
    }
    randomNumber = Math.floor(Math.random() * 10) + 1;

    document.getElementById("guess").value = "";
}

</script>

</body>
</html>
